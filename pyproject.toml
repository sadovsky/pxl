[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxl"
version = "0.1.0"
description = "CLI pixel art generator powered by Claude"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.25.0",
    "Pillow>=10.0.0",
    "click>=8.1.0",
]

[project.scripts]
pxl = "pxl.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
